<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanasō Japanese</title>
<meta name="theme-color" content="#1f3567">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hanasō">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, patient tutor; calm and encouraging, a long road made of short daily steps
   IDEA: a Japanese study notebook stamped with a teacher's red hanko as each unit is passed
   PICTURE: the N5→N1 path with the English→日本語 mix meter; big Klee One kana and kanji on practice squares
   COLOUR and TYPE: white paper, ai-iro indigo band, vermilion seal accent; Zen Kaku Gothic New UI, Klee One for characters
   LAYOUT: phone-first app — indigo header with meter, one view at a time, tab bar at the bottom */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1218);--ink:light-dark(#191c24,#eceef3);--mute:light-dark(#5d6372,#9aa1b2);
--card:light-dark(#f2f3f5,#1a1e28);--line:light-dark(#e1e3e8,#2a3040);
--ai:light-dark(#1f3567,#17264a);--ai2:light-dark(#2d4a8a,#8fa8e8);--aiSoft:light-dark(#e8ecf6,#1c2742);
--red:light-dark(#d93d27,#ff6a50);--redSoft:light-dark(#fdeae6,#3a1c18);--ok:light-dark(#1f7a4d,#5fd39a);--okSoft:light-dark(#e3f4ea,#16301f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;text-align:inherit}
:focus-visible{outline:2px solid var(--ai2);outline-offset:2px}
.kl{font-family:"Klee One","Zen Kaku Gothic New",serif}
ruby rt{font-size:.55em;color:var(--mute);font-weight:400}
.hide-furi rt{display:none}
h3{margin:18px 0 6px;font-size:18px}

header{background:var(--ai);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;flex:none}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.brand{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand small{font-weight:400;opacity:.75;font-size:13px}
@media(max-width:420px){.brand small{display:none}}
.chip{margin-left:auto;font-size:13px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{max-width:760px;margin:10px auto 0}
.mbar{height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff8a72,#e5432c);border-radius:99px;transition:width .8s ease}
.mlab{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-top:4px}
.seal{width:34px;height:34px;flex:none}

main{flex:1;display:flex;min-height:0;width:100%;max-width:760px;margin:0 auto}
.view{display:none;flex:1;overflow-y:auto;padding:16px 16px 28px;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#talk.on{display:flex;flex-direction:column;padding:0;overflow:hidden}
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--mute);min-height:54px;text-align:center}
nav button b{font-family:"Klee One",serif;font-size:20px;line-height:1.2;font-weight:600}
nav button.on{color:var(--red)}

/* generic */
h2.t{font-size:28px;line-height:1.1;margin:4px 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.card{background:var(--card);border-radius:16px;padding:16px}
.btn{background:var(--red);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px;text-align:center}
.btn.alt{background:var(--card);color:var(--ink);font-weight:500}
.card .btn.alt{background:var(--bg);border:1px solid var(--line)}
.btn.blue{background:var(--ai)}
.btn:disabled{opacity:.45}
.btn.wide{width:100%}
.mini{font-size:13px;color:var(--ai2);padding:6px 8px;border-radius:8px;min-height:34px}
.mini:hover{background:var(--aiSoft)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;min-height:40px;white-space:nowrap;text-align:center}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ai2);font-size:15px;min-height:40px;padding:0 4px;margin:-6px 0 4px -4px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--aiSoft);color:var(--ai2);white-space:nowrap}
.pill.red{background:var(--redSoft);color:var(--red)}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.bar.ok i{background:var(--ok)}
.qstat{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);gap:8px}
.foot{font-size:13px;color:var(--mute);margin-top:16px}
.err{background:var(--redSoft);border-radius:12px;padding:10px 14px;font-size:14px}
.loading{text-align:center;padding:48px 10px;color:var(--mute)}
.loading .seal{width:64px;height:64px;animation:sp 2.4s ease-in-out infinite;display:block;margin:0 auto 12px}
@keyframes sp{50%{transform:rotate(-12deg) scale(.94)}}

/* path */
.today{background:var(--ai);color:#fff;border-radius:18px;padding:16px;margin-bottom:18px}
.today .sub{color:#c9d4f0;margin:2px 0 12px}
.today h3{margin:4px 0 0;font-size:21px;line-height:1.2;text-wrap:balance}
.today .row{display:flex;gap:8px;flex-wrap:wrap}
.today .btn.alt{background:rgba(255,255,255,.14);color:#fff;border:0}
.plan{list-style:none;padding:0;margin:0 0 12px;font-size:15px}
.plan li{display:flex;gap:10px;padding:5px 0;align-items:baseline}
.plan b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);font-size:12px;flex:none}
.lvl{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.lh{display:flex;align-items:center;gap:12px;padding:14px;width:100%}
.lh .badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;background:var(--card);flex:none}
.lvl.cur .badge{background:var(--red);color:#fff}
.lvl.pass .badge{background:var(--ai);color:#fff}
.lh .w{flex:1}.lh b{display:block}.lh small{color:var(--mute);font-size:13px}
.ulist{border-top:1px solid var(--line);padding:4px 0}
.urow{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;min-height:56px}
.urow:disabled{opacity:.5;cursor:default}
.ust{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--card);flex:none}
.ust.done{background:var(--ai);color:#fff}.ust.cur{background:var(--red);color:#fff}
.urow .w{flex:1}.urow b{display:block;font-weight:500;line-height:1.3}.urow small{color:var(--mute);font-size:13px}
.steps{list-style:none;padding:0;margin:10px 0}
.steps li button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);min-height:54px}
.steps .w{flex:1}.steps b{display:block;font-weight:500;line-height:1.3}.steps small{color:var(--mute);font-size:13px}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}

/* lesson */
.lcard{background:var(--card);border-radius:18px;padding:18px;text-align:center}
.kbig{font-family:"Klee One",serif;font-size:clamp(84px,26vw,120px);line-height:1.15;display:block}
.wbig{font-size:34px;line-height:1.9;display:block}
.rd{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;margin:12px auto 0;max-width:340px;font-size:15px}
.rd span{color:var(--mute)}
.ex{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:10px;text-align:left;cursor:pointer}
.ex .jt{font-size:18px;line-height:1.9}
.rm{font-size:13px;color:var(--mute);font-style:italic}
.tr{font-size:14px;color:var(--mute)}
.tr.blur{filter:blur(5px);user-select:none;cursor:pointer}
.nav2{display:flex;gap:8px;margin-top:14px}.nav2 .btn{flex:1}
.dots{display:flex;gap:4px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--red)}
.gpt{border-left:3px solid var(--red);padding:2px 0 2px 14px;margin:18px 0}
.gpt h4{margin:0;font-size:22px;line-height:1.5}
.gpt .form{display:inline-block;background:var(--aiSoft);border-radius:8px;padding:3px 9px;font-size:14px;margin:6px 0}
.qq{font-size:20px;line-height:1.8;margin:12px 0 4px;font-weight:500}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;line-height:2;margin:10px 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.op{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;min-height:54px;line-height:1.7}
.op.good{background:var(--ok);color:#fff;border-color:transparent}.op.good rt{color:#e6fff0}
.op.bad{background:var(--red);color:#fff;border-color:transparent}.op.bad rt{color:#ffe9e4}
.ans{width:100%;font-size:24px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-top:12px}
.fb{margin:12px 0 6px;font-weight:700}.fb.good{color:var(--ok)}.fb.bad{color:var(--red)}
.why{font-size:15px;color:var(--mute);margin-bottom:12px}
.play{display:flex;align-items:center;gap:14px;background:var(--ai);color:#fff;border-radius:16px;padding:14px 16px;width:100%;margin:12px 0}
.play svg{width:40px;height:40px;flex:none}
.play small{display:block;opacity:.8;font-size:13px}
.line{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.line .who{font-size:13px;font-weight:700;color:var(--ai2);padding-top:4px;white-space:nowrap}
.line .jt{font-size:18px;line-height:1.9}
.score{font-size:56px;font-weight:700;line-height:1;margin:8px 0}
.miss{border-top:1px solid var(--line);padding:10px 0;font-size:15px}

/* talk */
.topics{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;flex:none;border-bottom:1px solid var(--line);scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.tp{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);font-size:14px;white-space:nowrap;min-height:38px}
.tp span{font-size:12px;color:var(--mute);margin-left:5px}
.tp.on{background:var(--ai);color:#fff}.tp.on span{color:#c9d4f0}
.tp.unit{border:1.5px solid var(--red)}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.me{justify-content:flex-end}
.bub{background:var(--card);border-radius:4px 18px 18px 18px;padding:11px 14px;max-width:88%}
.me .bub{background:var(--ai);color:#fff;border-radius:18px 4px 18px 18px}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}
.ja{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin:6px 0;cursor:pointer}
.jt{font-size:20px;line-height:1.9}
.corr{border-left:3px solid var(--red);background:var(--redSoft);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:14px}
.corr .jt{font-size:18px}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vc{font-size:13px;background:var(--aiSoft);border-radius:8px;padding:3px 8px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.sg{border:1px solid var(--ai2);color:var(--ai2);border-radius:99px;padding:6px 12px;font-size:15px;min-height:38px}
.typing{color:var(--mute);font-size:14px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin:0 2px;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.welcome{margin:auto;text-align:center;max-width:380px;padding:20px 8px}
.welcome .seal{width:84px;height:84px;margin:0 auto 10px;display:block}
.welcome h2{font-size:24px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.welcome p{color:var(--mute);margin:0 0 16px}
.uprog{flex:none;padding:6px 16px;font-size:13px;color:var(--mute);background:var(--aiSoft)}
.comp{flex:none;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:var(--bg)}
.comp textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.4;max-height:120px;min-height:44px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card);text-align:center}
.ib svg{width:22px;height:22px}
.ib.send{background:var(--red);color:#fff}
.ib.live{background:var(--red);color:#fff;animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 6px rgba(217,61,39,.25)}}
.help{flex:none;padding:10px 12px;border-top:1px solid var(--line);background:var(--aiSoft)}
.help .row{display:flex;gap:8px}
.help input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;background:var(--bg)}
.help .out{margin-top:8px;font-size:14px}
.notice{margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:var(--redSoft);font-size:14px}

/* kana & review */
.rows{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.rw{padding:5px 10px;border-radius:8px;background:var(--card);font-size:15px;min-height:36px;font-family:"Klee One",serif}
.rw.on{background:var(--ai);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kc{aspect-ratio:1/1;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center}
.kc b{font-family:"Klee One",serif;font-size:clamp(22px,6vw,32px);font-weight:400;line-height:1.1}
.kc small{font-size:12px;color:var(--mute)}
.kc.m1::after,.kc.m2::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#e9a23b}
.kc.m2::after{background:var(--ok)}
.kc.blank{background:none}
.gh{font-size:13px;color:var(--mute);margin:14px 0 6px}
.big{font-family:"Klee One",serif;font-size:clamp(96px,30vw,150px);line-height:1.1;margin:6px 0;text-align:center}
.prompt{font-size:30px;font-weight:700;margin:12px 0 2px;text-align:center}
.trwrap{position:relative;width:min(100%,340px);aspect-ratio:1/1;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--bg);border:2px solid var(--red)}
.trwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.due{display:flex;align-items:center;gap:12px;justify-content:space-between}
.due b{font-size:34px;line-height:1}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;margin:16px 0 8px}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.wl .w{flex:1}.wl .wj{font-size:19px;line-height:1.8}.wl .we{font-size:14px;color:var(--mute)}
.bx{font-size:12px;color:var(--mute);white-space:nowrap}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}

/* me */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.st{background:var(--card);border-radius:14px;padding:12px 14px}
.st b{display:block;font-size:28px;line-height:1.1}.st span{font-size:13px;color:var(--mute)}
.tgt{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tgt b{font-size:16px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set label{flex:1}.set small{display:block;color:var(--mute);font-size:13px}
.set select,.set input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:16px;max-width:55%}
.set input[type=range]{width:42%}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ai);color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.35s;max-width:min(92vw,420px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="seal" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#d93d27"/><circle cx="32" cy="32" r="24.5" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/><text id="sealch" x="32" y="43" text-anchor="middle" font-family="Klee One,serif" font-size="30" font-weight="600" fill="#fff">ゆ</text></symbol>
<symbol id="playi" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#fff" opacity=".16"/><path d="M16 12l12 8-12 8z" fill="#fff"/></symbol>
</defs></svg>

<header>
  <div class="hrow">
    <svg class="seal"><use href="#seal"/></svg>
    <div class="brand">話そう <small id="brandsub">Hanasō with Yuki</small></div>
    <div class="chip" id="lvchip">N5</div>
  </div>
  <div class="meter">
    <div class="mbar"><i id="mfill" style="width:10%"></i></div>
    <div class="mlab"><span>English</span><span id="mtext">10% 日本語</span><span>日本語</span></div>
  </div>
</header>

<main>
  <section class="view on" id="path"></section>
  <section class="view" id="lesson"></section>
  <section class="view" id="talk">
    <div class="topics" id="topics"></div>
    <div id="notice"></div>
    <div class="uprog" id="uprog" hidden></div>
    <div class="log" id="log"></div>
    <div class="sug" id="sug"></div>
    <div class="help" id="help" hidden>
      <div class="row"><input id="hq" placeholder="How do I say… (type English)" enterkeyhint="go"><button class="btn" id="hgo" style="padding:8px 14px">Ask</button></div>
      <div class="out" id="hout"></div>

function normalizeMsg(r){

 if(!lines.length)return null;
 const c=r.correction&&r.correction.better?{better:String(r.correction.better),romaji:String(r.correction.romaji||''),why:String(r.correction.why||'')}:null;
 const vocab=(Array.isArray(r.vocab)?r.vocab:[]).filter(v=>v&&v.jp).slice(0,6).map(v=>({jp:String(v.jp),reading:String(v.reading||reading(v.jp)),romaji:String(v.romaji||''),en:String(v.en||'')}));
 return{role:'yuki',lines,correction:c,vocab,score:Math.max(0,Math.min(3,Math.round(+r.score||0))),suggest:(Array.isArray(r.suggest)?r.suggest:[]).map(String).filter(Boolean).slice(0,3),say:lines.map(l=>plain(l.text)).join(' ')}}

 const tg=LVS.map(lv=>{const its=lv.units.flatMap(x=>ITEMS[x.id]||[]);const w=its.filter(x=>x.t==='w').length,k=its.filter(x=>x.t==='k').length;return `<div class="tgt"><b>${lv.name}</b><div><div class="qstat"><span>${w} / ${lv.words} words · ${k} / ${lv.kanji} kanji</span><span>${lvDone(lv)}/${lv.units.length} units</span></div><div class="bar"><i style="width:${Math.min(100,(w/lv.words*70+k/lv.kanji*30))}%"></i></div></div></div>`}).join('');
 $('#me').innerHTML=`<h2 class="t">Your progress</h2><p class="sub">Now: ${u.lv.name} · ${esc(u.t)} · conversation stage ${stage()} (${ST().mix}% Japanese)</p>
 <div class="stats"><div class="st"><b>${S.xp}</b><span>XP</span></div><div class="st"><b>${streak()}</b><span>day streak</span></div><div class="st"><b>${all.filter(x=>x.t==='w').length}</b><span>words in review</span></div><div class="st"><b>${all.filter(x=>x.t==='k').length}</b><span>kanji learned</span></div><div class="st"><b>${km}</b><span>kana mastered</span></div><div class="st"><b>${S.stats.jp}</b><span>replies in Japanese</span></div></div>
 <h3>JLPT targets</h3><p class="sub" style="margin:0 0 4px">Approximate new words and kanji each level adds. The bar mixes both.</p>${tg}
 <h3 id="aibox">Your AI</h3>
 <p class="sub" style="margin:0 0 4px">Lessons and conversations use your own AI account. Your key is stored only on this device and sent only to your provider.</p>
 <div class="set"><label for="aiprov">Provider</label><select id="aiprov">${Object.entries(PROV).map(([k,v])=>`<option value="${k}" ${AI.provider===k?'selected':''}>${v.name}</option>`).join('')}</select></div>
 ${AI.provider==='custom'?`<div class="set"><label for="aibase">Server URL<small>OpenAI-compatible, ending in /v1 (e.g. http://localhost:11434/v1 for Ollama)</small></label><input type="text" id="aibase" value="${esc(AI.base)}" placeholder="https://…/v1"></div>`:''}
 <div class="set"><label for="aikey">API key<small>${PROV[AI.provider].keyUrl?`Get one at <a href="${PROV[AI.provider].keyUrl}" target="_blank" rel="noopener">${PROV[AI.provider].keyUrl.replace('https://','')}</a>`:'Leave blank if your server needs none'}</small></label><input type="password" id="aikey" value="${esc(AI.key)}" autocomplete="off" placeholder="paste key"></div>
 <div class="set"><label>Models<small>${AI.models.length?AI.models.length+' available':'Load the list after entering your key'}</small></label><button class="btn alt" id="aiload">${AIBUSY?'Loading…':'Load models'}</button></div>
 <datalist id="aimodels">${AI.models.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
 <div class="set"><label for="aismart">Lesson model<small>Writes lessons, scenes and tests: pick a capable one</small></label><input type="text" id="aismart" list="aimodels" value="${esc(AI.smart)}" placeholder="model id"></div>
 <div class="set"><label for="aifast">Chat model<small>For quick replies; can be a faster, cheaper one</small></label><input type="text" id="aifast" list="aimodels" value="${esc(AI.fast)}" placeholder="same as lesson model"></div>
 <div class="set"><label>${aiReady()?'Ready':'Not set up yet'}<small>${esc(AIMSG)}</small></label><button class="btn" id="aitest" ${aiReady()?'':'disabled'}>Test</button></div>
 <h3>Backup &amp; devices</h3>
 <p class="sub" style="margin:0 0 4px">Progress is saved on this device. Use a backup file to move it to another phone or tablet, or to bring progress over from the Claude version.</p>
 <div class="nav2"><button class="btn alt" id="bexp">Export backup</button><label class="btn alt" style="flex:1">Import backup<input type="file" id="bimpf" accept=".json,application/json" hidden></label></div>
 <textarea id="bimpt" class="search" placeholder="…or paste backup text here" style="min-height:60px"></textarea><div class="nav2" style="margin-top:0"><button class="btn alt" id="bimp">Import pasted backup</button></div>
 ${IMPMSG?`<p class="foot">${esc(IMPMSG)}</p>`:''}
 ${matchMedia('(display-mode: standalone)').matches?'':`<h3>Install on your phone</h3><p class="sub">${INSTALLEV?'':'iPhone/iPad: open this page in Safari, tap Share, then “Add to Home Screen”. Android: Chrome menu › “Install app”.'}</p>${INSTALLEV?'<button class="btn wide" id="binstall">Install Hanasō</button>':''}`}
 <h3>Settings</h3>
 <div class="set"><label for="stutor">Tutor's name<small>English and Japanese (the seal shows the first kana)</small></label><span style="display:flex;gap:6px;max-width:55%"><input type="text" id="stutor" value="${esc(S.set.tutor)}" style="max-width:50%"><input type="text" id="stutorja" lang="ja" value="${esc(S.set.tutorJa)}" style="max-width:50%"></span></div>
 <div class="set"><label for="sname">Your name<small>What ${esc(TN())} calls you</small></label><input type="text" id="sname" value="${esc(S.set.name)}" placeholder="Jon"></div>
 <div class="set"><label>Speak replies aloud<small>${esc(TN())} reads each reply automatically</small></label><button class="sw ${S.set.auto?'on':''}" id="sauto" aria-label="Toggle auto-speak"></button></div>
 <div class="set"><label for="srate">Speaking speed<small>${S.set.rate.toFixed(2)}× (listening scenes also speed up by level)</small></label><input type="range" id="srate" min="0.6" max="1.2" step="0.05" value="${S.set.rate}"></div>
 <div class="set"><label for="svoice">${esc(TN())}'s voice<small>${jv.length?'Female Japanese voices are picked first':'No Japanese voice on this device; add one in your phone’s speech settings'}</small></label><select id="svoice"><option value="">Auto (female)</option>${jv.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===S.set.voice?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>
 <div class="set"><label for="sromaji">Romaji<small>Latin-letter spelling under Japanese</small></label><select id="sromaji">${['auto','on','off'].map(o=>`<option ${S.set.romaji===o?'selected':''} value="${o}">${o==='auto'?'Auto (early N5)':o==='on'?'Always':'Never'}</option>`).join('')}</select></div>
 <div class="set"><label for="seng">English translations<small>Hidden until tapped when off</small></label><select id="seng">${['auto','on','off'].map(o=>`<option ${S.set.english===o?'selected':''} value="${o}">${o==='auto'?'Auto (early N5)':o==='on'?'Always show':'Tap to reveal'}</option>`).join('')}</select></div>
 <div class="set"><label>Furigana<small>Small readings above kanji</small></label><button class="sw ${S.set.furi?'on':''}" id="sfuri" aria-label="Toggle furigana"></button></div>
 <div class="set"><label for="slock">Conversation mix<small>Follows your unit, or pin a stage</small></label><select id="slock"><option value="0">Automatic</option>${STAGES.map((x,i)=>`<option value="${i+1}" ${S.set.lock===i+1?'selected':''}>${i+1}: ${x.name} (${x.mix}%)</option>`).join('')}</select></div>
 <div class="set"><label>Reset all progress<small>${resetArm?'Tap again to erase everything':'Units, cards, conversations'}</small></label><button class="btn alt" id="sreset" style="${resetArm?'background:var(--red);color:#fff':''}">${resetArm?'Confirm':'Reset'}</button></div>
 <p class="foot">${DICT?'The mic button uses your device’s speech recognition in Japanese.':'Voice input: use the microphone on your phone’s keyboard; Japanese keyboard dictation works too.'}</p>`}
$('#me').addEventListener('click',async e=>{const id=e.target.id;
 if(id==='aiload'){if(AIBUSY)return;AIBUSY=true;AIMSG='';renderMe();try{const ids=await listModels();AI.models=ids.sort();const g=guessModels(AI.models);if(!AI.smart||!AI.models.includes(AI.smart))AI.smart=g.smart;if(!AI.fast||!AI.models.includes(AI.fast))AI.fast=g.fast;AIMSG=`Loaded ${ids.length} models. Suggested picks filled in; change them if you like.`}catch(er){AIMSG=errText(er)}AIBUSY=false;saveAI();refreshAI();return renderMe()}
 if(id==='aitest'){AIMSG='Testing…';renderMe();try{const r=await aiJSON('Reply with JSON {"ok":true,"jp":"こんにちは"} only.','fast');AIMSG=r&&r.ok?'Connected ✓ '+(r.jp||''):'Connected, but the reply was unexpected.'}catch(er){AIMSG=errText(er)+(er&&er.message?' ('+String(er.message).slice(0,120)+')':'')}return renderMe()}
 if(id==='bexp'){const json=JSON.stringify({app:'hanaso',v:2,at:Date.now(),state:S,items:ITEMS});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='hanaso-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();IMPMSG='Backup file created.';return renderMe()}
 if(id==='bimp'){return doImport(($('#bimpt')||{}).value||'')}
 if(id==='binstall'&&INSTALLEV){INSTALLEV.prompt();INSTALLEV=null;return}
 if(id==='sauto')S.set.auto=!S.set.auto;else if(id==='sfuri'){S.set.furi=!S.set.furi;renderHead()}
 else if(id==='sreset'){if(!resetArm){resetArm=true;renderMe();setTimeout(()=>{resetArm=false;view==='me'&&renderMe()},4000);return}
  const keep=S.set;S=fresh();S.set=keep;Object.keys(ITEMS).forEach(b=>{ITEMS[b]=[];saveBucket(b)});resetArm=false;renderHead();toast('Progress reset.')}
 else return;save();renderMe()});
function doImport(txt){try{const o=JSON.parse(String(txt).trim());if(!o||o.app!=='hanaso'||!o.state||o.state.v!==2)throw 0;
  S=Object.assign(fresh(),o.state,{set:Object.assign(freshSet(),o.state.set||{})});ITEMS=o.items||{};S.buckets=Object.keys(ITEMS);if(!S.buckets.includes('talk'))S.buckets.push('talk');save();S.buckets.forEach(b=>{ITEMS[b]=ITEMS[b]||[];saveBucket(b)});
  IMPMSG=`Imported: ${Object.keys(S.unitPass).length} units passed, ${allItems().length} review cards.`;renderHead();renderMe()}catch(e){IMPMSG='That isn’t a Hanasō backup.';renderMe()}}
$('#me').addEventListener('change',e=>{const t=e.target;
 if(t.id==='bimpf'&&t.files[0]){t.files[0].text().then(doImport);return}
 if(['aiprov','aikey','aibase','aismart','aifast'].includes(t.id)){if(t.id==='aiprov'){AI.provider=t.value;AI.models=[];AI.smart='';AI.fast='';AIMSG=''}if(t.id==='aikey')AI.key=t.value.trim();if(t.id==='aibase')AI.base=t.value.trim();if(t.id==='aismart')AI.smart=t.value.trim();if(t.id==='aifast')AI.fast=t.value.trim();saveAI();refreshAI();return renderMe()}
 if(t.id==='sname')S.set.name=t.value.trim().slice(0,30);
 if(t.id==='stutor')S.set.tutor=t.value.trim().slice(0,20)||'Yuki';
 if(t.id==='stutorja')S.set.tutorJa=t.value.trim().slice(0,10)||'ゆき';
 if(t.id==='srate'){S.set.rate=+t.value;sayJa('こんにちは、ゆきです。')}
 if(t.id==='svoice'){S.set.voice=t.value;sayJa('こんにちは、ゆきです。よろしくお願いします。')}
 if(t.id==='sromaji')S.set.romaji=t.value;if(t.id==='seng')S.set.english=t.value;
 if(t.id==='slock'){S.set.lock=+t.value}
 save();renderHead();renderMe()});

/* ================= boot ================= */
renderHead();renderPath();
refreshAI();
DICT=makeDict();
if(DICT){$('#mic').hidden=false;
 DICT.onPartial(({text})=>{$('#box').value=(micBase+' '+text).trim();grow()});
 DICT.onFinal(({text})=>{micBase=(micBase+' '+text).trim();$('#box').value=micBase;grow()});
 DICT.onState(({state})=>{listening=state==='listening';$('#mic').classList.toggle('live',listening)})}
IDB.all().then(d=>{LIB=d||[]}).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(!localStorage.getItem('hanaso-welcome')){localStorage.setItem('hanaso-welcome','1');setTimeout(()=>toast('Welcome! Start with kana on the Path, and set up your AI in Progress › Your AI.'),600)}}catch(e){}
}
</script>
